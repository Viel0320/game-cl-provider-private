proxy-groups:
- name: "🚀 节点选择"
  type: select
  proxies:
  - "🚀 备用应急"
  - "♻️ 低价节点"
  - "🇺🇲 美国节点"
  - "🇯🇵 日本节点"
  - "🇭🇰 香港节点"
  - "🔯 美国故转"
  - "🔯 香港故转"
  - "🔯 日本故转"
  - "🌐 全部节点"
  - 全球直连
- name: "🌐 全部节点"
  type: select
  include-all: true
- name: "📹 YouTube"
  type: select
  proxies: *1
- name: "🍀 Google"
  type: select
  proxies: *1
- name: "🤖 ChatGPT"
  type: select
  proxies: *1
- name: "👨🏿‍💻 GitHub"
  type: select
  proxies: *1
- name: "🐬 OneDrive"
  type: select
  proxies: *1
- name: "🪟 Microsoft"
  type: select
  proxies: *1
- name: "🎵 TikTok"
  type: select
  proxies: *1
- name: "📲 Telegram"
  type: select
  proxies:
  - "🚀 备用应急"
  - "🚀 节点选择"
  - "🌐 全部节点"
- name: "🎥 NETFLIX"
  type: select
  proxies: *1
- name: "✈️ Speedtest"
  type: select
  proxies: *1
- name: "💶 PayPal"
  type: select
  proxies: *1
- name: "🍎 Apple"
  type: select
  proxies:
  - 全球直连
  - "🚀 节点选择"
- name: "🎮 游戏平台"
  type: select
  proxies:
  - "🚀 节点选择"
  - "🌐 全部节点"
  - 全球直连
- name: "🎯 全球直连"
  type: select
  proxies:
  - 全球直连
  - "🚀 节点选择"
- name: "🆎 广告拦截"
  type: select
  proxies:
  - REJECT
  - 全球直连
  - "🚀 节点选择"
- name: "🐟 漏网之鱼"
  type: select
  proxies: *1
- name: "🇺🇲 美国节点"
  type: select
  include-all: true
  filter: "(?i)美|us|unitedstates|united states|🇺🇸"
- name: "🇯🇵 日本节点"
  type: select
  include-all: true
  filter: "(?i)日|jp|japan|🇯🇵"
- name: "🇭🇰 香港节点"
  type: select
  include-all: true
  filter: "(?i)港|hk|hongkong|hong kong|🇭🇰"
- name: "🚀 备用应急"
  type: select
  include-all: true
  tolerance: 20
  interval: 300
  filter: "(?=.*(美|US|(?i)States|America|🇺🇸))^((?!(港|台|韩|新|日|0.1)).)*$"
- name: "🔯 美国故转"
  type: fallback
  include-all: true
  tolerance: 20
  interval: 300
  filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"
- name: "🔯 日本故转"
  type: fallback
  include-all: true
  tolerance: 20
  interval: 300
  filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$"
- name: "🔯 香港故转"
  type: fallback
  include-all: true
  tolerance: 20
  interval: 300
  filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"
- name: "♻️ 低价节点"
  type: select
  include-all: true
  tolerance: 20
  interval: 300
  filter: "^(?=.*(0.1|0.01)).*$"

