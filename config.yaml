proxy-providers:
  Airport_01:
    type: http
    interval: 0
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 全球直连
    url: your link here
    path: "./proxy_provider/subscription_1.yaml"

mixed-port: 7890
tproxy-port: 7895
authentication:
- "user:passwd"
skip-auth-prefixes:
- 127.0.0.0/8
- 192.168.0.0/16
ipv6: false
allow-lan: true
bind-address: "*"
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 300.0

external-controller: 0.0.0.0:9090
secret: '123456'
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://codeload.github.com/Zephyruso/zashboard/zip/refs/heads/gh-pages-cdn-fonts

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
  - "+.v2ex.com"
  - "+.sankakuapp.com"
  - "+.sankakuapi.com"
  - "+.sankakucomplex.com"
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - "+.push.apple.com"
  - "+.apple.com"

ntp:
  enable: true
  server: time.apple.com
  port: 123
  interval: 30
  write-to-system: true

tun:
  enable: true
  stack: mips   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  route-exclude-address-set:
    - cn_ip

hosts:
  localhost:
  - 127.0.0.1
  - ::1
  xn--ngstr-lra8j.com:
  - 220.181.174.194
  openwrt.lan: lan
  immortalwrt.lan: lan
  lede.lan: lan
  router.lan: lan
  QWRT.lan: lan

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
    - https://1.1.1.1/dns-query#🚀 节点选择&disable-qtype-65=true
  nameserver:
    - https://1.1.1.1/dns-query#🚀 节点选择&ecs=223.5.5.0/24
  fallback:
    - https://1.1.1.1/dns-query#🚀 节点选择
  fallback-filter:
    geoip: true
    geoip-code: CN
  use-hosts: true
  fake-ip-filter:
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain
    - "+.services.googleapis.cn"
    - "+.googleapis.cn"
    - "+.xn--ngstr-lra8j.com"
    - geosite:cn
    - stun.*.*
    - stun.*.*.*
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.stun.*.*.*.*"
    - "+.stun.*.*.*.*.*"
    - "*.lan"
    - "+.local"
    - "+.msftncsi.com"
    - msftconnecttest.com
    - time?.*.com
